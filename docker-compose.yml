# MemoraGraph — Docker Compose (Day 5)
#
# FalkorDB and Supabase are cloud-hosted (see falkordb.cloud / supabase.com),
# so this only runs the FastAPI app itself. All secrets come from your
# local .env file — never commit that file.

version: "3.9"

services:
  memoragraph-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoragraph-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
