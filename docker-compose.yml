services:

  memoragraph-ingestion:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: memoragraph-ingestion

    ports:
      - "8000:8000"

    env_file:
      - .env

    # NEW: persist the sentence-transformers + docling model cache across
    # container rebuilds. Without this, every `docker compose up --build`
    # starts from an empty /root/.cache and has to re-download the
    # embedding model + Docling's ~1-2GB ML models from the internet
    # before the app can even start (this is what looks like "stuck").
    volumes:
      - model-cache:/root/.cache

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s   # NEW: give the model download/load time on cold start


  memoragraph-mcp:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: memoragraph-mcp

    env_file:
      - .env

    volumes:
      - model-cache:/root/.cache

    command: ["python", "-m", "application.mcp.server"]

    stdin_open: true
    tty: true          # NEW: stdio MCP transport needs a real attached tty/pipe

    profiles:
      - mcp

volumes:
  model-cache: