version: "3.9"

services:
  memoragraph-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoragraph-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  memoragraph-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoragraph-mcp
    env_file:
      - .env
    command: ["python", "-m", "application.mcp_server.server"]
    stdin_open: true   # required — MCP talks over stdin/stdout
    tty: true
    profiles:
      - mcp            # won't start with plain `docker compose up`