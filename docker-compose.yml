services:
  memoragraph-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoragraph-ingestion
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  memoragraph-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memoragraph-mcp
    env_file:
      - .env
    command: ["python", "-m", "application.mcp.server"]
    stdin_open: true
    tty: true
    profiles:
      - mcp