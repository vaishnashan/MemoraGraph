version: "3.9"

services:
  backend:
    build: .
    container_name: memoragraph-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - falkordb
      - ollama
    volumes:
      - ./app:/app/app

  falkordb:
    image: falkordb/falkordb:latest
    container_name: memoragraph-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: memoragraph-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  falkordb_data:
  ollama_data:
