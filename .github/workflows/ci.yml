name: MemoraGraph CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  validate-python:
    name: Validate Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q application

      - name: Check FastAPI application import
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SECRET_KEY: "placeholder"
          SUPABASE_STORAGE_BUCKET: "placeholder"

          FALKORDB_HOST: "placeholder"
          FALKORDB_PORT: "6379"
          FALKORDB_PASSWORD: "placeholder"

          GROQ_API_KEY: "placeholder"

        run: |
          python -c "from application.main import app; print('FastAPI application loaded successfully:', app.title)"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: validate-python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t memoragraph:${{ github.sha }} \
            -t memoragraph:latest \
            .