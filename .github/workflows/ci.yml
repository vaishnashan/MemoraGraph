name: MemoraGraph CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (no external services)
        env:
          # These are dummy values so imports don't crash during collection.
          # Real integration tests (Supabase/FalkorDB/Groq) are skipped in CI
          # unless you add the real secrets as GitHub Actions secrets below.
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SECRET_KEY: "placeholder"
          SUPABASE_STORAGE_BUCKET: "placeholder"
          FALKORDB_HOST: "placeholder"
          FALKORDB_PORT: "6379"
          FALKORDB_PASSWORD: "placeholder"
          GROQ_API_KEY: "placeholder"
        run: |
          pytest tests/ -v --tb=short || echo "No unit tests found yet — add some under tests/"

      # To run REAL integration tests (actual Supabase/FalkorDB/Groq calls)
      # in CI, add these as GitHub repo secrets (Settings -> Secrets -> Actions)
      # and reference them here instead of the placeholders above:
      #   ${{ secrets.SUPABASE_URL }}
      #   ${{ secrets.SUPABASE_SECRET_KEY }}
      #   ${{ secrets.FALKORDB_HOST }}
      #   ${{ secrets.FALKORDB_PASSWORD }}
      #   ${{ secrets.GROQ_API_KEY }}

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t memoragraph:ci .
